name: Snapshot pre-release
on:
  push:
    branches:
      - snapshot-release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
permissions: {}

jobs:
  check-snapshot:
    name: Check version is a SNAPSHOT
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_snapshot: ${{ steps.check.outputs.is_snapshot }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Read version from root pom.xml
        id: check
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Package and publish snapshot pre-release
    needs: check-snapshot
    if: needs.check-snapshot.outputs.is_snapshot == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Create the release and upload its assets.
    env:
      VERSION: ${{ needs.check-snapshot.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Test and package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn --batch-mode --update-snapshots verify test package
      - run: mkdir -v staging && cp -v **/target/*.jar staging
      - run: npm ci && npm run package
        working-directory: magik-language-server/client-vscode
      - run: cp -v magik-language-server/client-vscode/magik-language-server-*.vsix staging
      - run: rm -vf staging/original-*.jar

      - name: Delete previous snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete "${VERSION}" --yes --cleanup-tag 2>/dev/null || true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "${VERSION}" --prerelease --title "${VERSION}"
          --target snapshot-release
          --notes "⚠️ Pre-release snapshot build - not for production use."
          staging/*
